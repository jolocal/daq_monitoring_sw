spring:
  profiles:
    active: local # 기본으로 local 환경을 실행하도록 지정

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        storage_engine: innodb
        format_sql: false
        use_sql_comments: false
    hibernate:
      ddl-auto: validate # validate: 데이터베이스 스키마 검증, create: 데이터베이스 스키마 생성, update: 데이터베이스 스키마 업데이트, none: 데이터베이스 스키마 변경 없음
    open-in-view: true
    show_sql: false

  netty:
    boss-count: 1    # Netty boss 쓰레드 개수
    worker-count: 4  # Netty worker 쓰레드 개수
    keep-alive: true # TCP keep-alive 설정
    backlog: 100     # TCP backlog 설정

  logging:
    level:
      root: INFO
      com.example.daq_monitoring_sw: DEBUG
      io.netty: DEBUG
      org.springframework: INFO 

server:
  port: 9531
